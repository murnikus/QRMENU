<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        #pdfViewer {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }

        #notFound {
            font-size: 24px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

<iframe id="pdfViewer"></iframe>
<div id="notFound">Menu not found.</div>

<script>
const pdfPath = "menu.pdf";

fetch(pdfPath, { method: "HEAD" })
    .then(response => {
        if (response.ok) {
            document.getElementById("pdfViewer").src = pdfPath;
            document.getElementById("pdfViewer").style.display = "block";
        } else {
            document.getElementById("notFound").style.display = "block";
        }
    })
    .catch(() => {
        document.getElementById("notFound").style.display = "block";
    });
</script>

</body>
</html>
